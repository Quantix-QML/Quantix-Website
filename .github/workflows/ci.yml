name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress CI runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── LINT & TYPE-CHECK ──────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint — if no config exists yet this step is skipped gracefully
      - name: Lint (ESLint)
        run: |
          if [ -f ".eslintrc*" ] || [ -f "eslint.config*" ]; then
            npx eslint src --ext .js,.jsx --max-warnings 0
          else
            echo "No ESLint config found — skipping lint step."
          fi

      # Vite performs a type-check pass during build; run it ahead of the full build
      - name: Type-check (Vite + React)
        run: npx vite build --mode production --logLevel warn

  # ── BUILD CHECK ───────────────────────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      # Upload the dist folder as an artifact so it can be inspected in the
      # GitHub Actions UI for debugging, and reused in later pipeline jobs.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── BUNDLE SIZE REPORT ────────────────────────────────────────────────────
  bundle-size:
    name: Bundle size report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Report bundle sizes
        run: |
          echo "## Bundle size report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzip |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/*.js dist/assets/*.css dist/index.html; do
            if [ -f "$f" ]; then
              raw=$(wc -c < "$f")
              gz=$(gzip -c "$f" | wc -c)
              raw_kb=$(echo "scale=1; $raw/1024" | bc)
              gz_kb=$(echo "scale=1; $gz/1024" | bc)
              echo "| $(basename $f) | ${raw_kb} kB | ${gz_kb} kB |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          # Fail the job if main JS bundle > 2 MB gzipped (safety guard)
          for f in dist/assets/*.js; do
            gz=$(gzip -c "$f" | wc -c)
            if [ "$gz" -gt 2097152 ]; then
              echo "::error file=$(basename $f)::Gzipped bundle exceeds 2 MB limit (${gz} bytes). Consider code-splitting."
              exit 1
            fi
          done
