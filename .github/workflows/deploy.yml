name: Deploy to GitHub Pages

on:
  # Only trigger deploy from the main branch after CI passes
  push:
    branches:
      - main
  workflow_dispatch:

# Minimal permissions: only Pages gets write access
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys so a mid-deploy push doesn't corrupt the live site.
# "cancel-in-progress: false" queues rather than cancels — deliberate for safety.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── BUILD ──────────────────────────────────────────────────────────────────
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Configure the Pages environment BEFORE the build so any injected
      # base URL env vars are available during the Vite build step.
      - name: Configure GitHub Pages environment
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ── DEPLOY ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
